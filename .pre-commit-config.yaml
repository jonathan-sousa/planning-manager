# Generated by baseline-init.
# Update fragments in $(chezmoi source-path)/dev-baseline/pre-commit/ then re-run.
repos:
  # Universal hooks — applied to every project (Tier 1).
  # Format: pre-commit `repos` list items (no outer `repos:` key).
  #
  # The whitespace fixers below carry an `exclude` for two categories that must
  # never be rewritten. Found the hard way on ui-account (2026-08-03), a Rails
  # app first migrated to this baseline:
  #
  #   - Rails `config/credentials.yml.enc` — encrypted content. end-of-file-fixer
  #     appended a newline to it. Whether Rails still decrypts afterwards is
  #     beside the point: there is no upside to touching ciphertext, and the
  #     downside is an app that cannot read its own secrets.
  #   - Lockfiles — mixed-line-ending rewrote 2450 lines of a yarn.lock that had
  #     CRLF endings. Semantically harmless, but it turns a dependency file into
  #     a merge-conflict generator and hides real changes in the noise.
  #     `.prettierignore` already covers lockfiles; these hooks do not read it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &binary_and_locks '(\.enc$|(^|/)(yarn\.lock|package-lock\.json|pnpm-lock\.yaml|Gemfile\.lock|poetry\.lock|uv\.lock|Cargo\.lock)$)'
      - id: end-of-file-fixer
        exclude: *binary_and_locks
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: *binary_and_locks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml"]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
  # DO NOT run a bare `pre-commit autoupdate` on this entry: it moves gitleaks
  # BACKWARDS, v8.30.1 -> v8.30.0. autoupdate resolves the latest tag reachable
  # from the default branch, and gitleaks tagged v8.30.1 on commit 83d9cd68,
  # which is not on `master` — while the GitHub API reports v8.30.1 as the latest
  # release. Downgrading the secrets scanner is the one regression this baseline
  # cannot afford. Bump the others selectively instead:
  #   pre-commit autoupdate --repo <url> [--repo <url> ...]
  # Re-check by hand when a v8.31.x lands on the default branch.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Node / TS — prettier only. eslint lives in node-eslint.yaml and is added
  # separately, because a package.json does not imply an eslint setup: ui-account
  # has one for Webpacker and no eslint at all, and the hook there could only ever
  # fail with "npx canceled due to missing packages".
  #
  # Using rbubley/mirrors-prettier (maintained fork): the upstream
  # pre-commit/mirrors-prettier is archived since 2024 and its newest tag is a
  # broken 4.x alpha.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown, html]
  # oxlint — added only when the project actually uses oxlint: a `.oxlintrc*`
  # config, or oxlint in package.json. Same reasoning as node-eslint.yaml: a hook
  # that cannot run would only train you to commit with --no-verify.
  #
  # `npx --no` resolves the project's own oxlint and refuses to download one, so
  # CI and local agree on the version.
  #
  # `--deny-warnings`: oxlint exits 0 on warnings, and pre-commit hides the output
  # of a passing hook, so a warning (a leftover `debugger`) would go unseen.
  # Projects align their `lint` script on the same flag.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npx --no -- oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
        require_serial: true
        pass_filenames: true
        stages: [pre-commit]
  # Python — ruff lint + format (auto-fix).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
